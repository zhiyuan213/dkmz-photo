# ============================================================
# 登科喵证件照后端 —— 配置（云托管部署时全部由环境变量覆盖，无需改代码）
#
#   WX_APPID / WX_SECRET                 小程序 AppID（wx3e149506a33d7e64）与 AppSecret
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
#   PHOTO_JOB_TOKEN                      运维接口口令（换成随机串）
#   XPHOTO_ENABLED / XPHOTO_OFFER_ID / XPHOTO_APP_KEY / XPHOTO_ENV / XPHOTO_PUSH_TOKEN / XPHOTO_GOODS
#
# ⚠️ 安全：默认值一律留空/占位，禁止把真实密钥写进仓库。
# ============================================================
server:
  port: 8080

spring:
  datasource:
    # 建议独立库 dkmz_photo（与 exam_countdown 同实例不同库即可；表名也已加 photo_ 前缀防撞）
    # 下面的默认值 = 云托管现网实际跑通的那串（仅把主机换成 localhost），照抄即可：
    #   characterEncoding  必须写 **Java 字符集名**：UTF-8 或 utf8 都可以（utf8 是 Java 别名）；
    #                      ⚠️ 写 utf8mb4 会抛 Unsupported character encoding 'utf8mb4' 导致启动失败
    #                      （utf8mb4 是 MySQL 的字符集名，不是 Java 的）
    #   createDatabaseIfNotExist=true  库不存在时自动建（云托管上库已建好，留着无害，本地开发省一步）
    #   如遇 Public Key Retrieval is not allowed / CommunicationsException，
    #   再追加 &useSSL=false&allowPublicKeyRetrieval=true（现网未用，说明该实例非该认证模式）
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dkmz_photo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # 会员发放使用数据库 NOW()，连接建立时固定为北京时间，避免数据库主机时区造成偏差。
      connection-init-sql: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: always   # 每次启动执行 schema.sql（全部 IF NOT EXISTS，可重复执行）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  # true = 云托管云调用通道（容器内 http://api.weixin.qq.com 由网关转发，免鉴权且绕过容器证书链问题）
  # 本地开发设 false 走 https + secret
  cloud-call: ${WX_CLOUD_CALL:true}
  # ------------------------------------------------------------
  # 虚拟支付（道具直购 short_series_goods）
  # 开通后把下面几项配到云托管环境变量；未配置时 enabled=false，
  # /api/photo/pay/* 明确返回「支付功能尚未开通」，不影响规格库与免费制作功能。
  #   XPHOTO_ENABLED        总开关（开通虚拟支付并自测通过后置 true）
  #   XPHOTO_OFFER_ID       mp 后台「虚拟支付 → 基础配置」的 OfferID
  #   XPHOTO_APP_KEY        现网 AppKey（密钥！只配环境变量）
  #   XPHOTO_ENV            0 现网 / 1 沙箱
  #   XPHOTO_PUSH_TOKEN     mp 后台消息推送 Token（校验推送来源）
  #   XPHOTO_GOODS          商品 goodsId:priceFen:quota:vipDays:name，多项 ; 分隔
  # ⚠️ goodsId 与 priceFen 必须与后台「道具管理」完全一致，否则拉起支付被微信拒绝。
  #    iOS 端可能有最低金额门槛，若报错把单价调到 ≥6 元再试。
  # ------------------------------------------------------------
  pay:
    enabled: ${XPHOTO_ENABLED:false}
    offer-id: ${XPHOTO_OFFER_ID:}
    appkey: ${XPHOTO_APP_KEY:}
    appkey-sandbox: ${XPHOTO_APP_KEY_SANDBOX:}
    env: ${XPHOTO_ENV:0}
    push-token: ${XPHOTO_PUSH_TOKEN:}
    # 2026-10-14 调价：张数包改为「¥3.90 / 5 次」「¥6.90 / 10 次」，**年会员商品已下架**。
    # 但后端会员能力（vip_expire_at / addVipDays / reduceVipDays / view 的 remaining=-1）
    # 必须保留：已购年卡的老用户仍在有效期内、历史订单退款也要走这条路径。
    # 下架只是不再出现在 /api/photo/pay/goods 里，不是把能力删掉。
    goods: ${XPHOTO_GOODS:photo5:390:5:0:高清导出 5 次;photo10:690:10:0:高清导出 10 次}

# 运维/管理接口口令（规格库后台维护、兜底查单、订单总览、权益修数）
photo:
  # 小程序审核模式：true 隐藏购买入口并允许免费导出；false 走正常权益校验。
  review-mode: ${REVIEW_MODE:false}
  job-token: ${PHOTO_JOB_TOKEN:change-me}
  # ------------------------------------------------------------
  # 端上抠图模型（MODNet / ONNX，25MB，**不能打进小程序包**，只能运行时下载）
  #   文件位置：classpath:/static/models/<file-name>，随镜像一起部署
  #   XPHOTO_MODEL_URL：**对外可访问的 https 绝对地址**，如
  #     https://<云托管默认域名>/models/modnet-fp32.onnx
  #     配了之后由 /api/photo/specs 下发给端上，端上优先用它 ——
  #     换 CDN / 换模型只改这个环境变量，**不用重发小程序**。
  #     置空 = 不下发，端上退回内置兜底常量（仅供本地联调，生产必须配）。
  #   ⚠️ 该域名还要加进 mp 后台「开发设置 → 服务器域名 → downloadFile 合法域名」，
  #     必须 https 且已 ICP 备案，否则正式版小程序下载会被拒。
  # ------------------------------------------------------------
  model:
    file-name: ${XPHOTO_MODEL_FILE:modnet-fp32.onnx}
    url: ${XPHOTO_MODEL_URL:}
  # /idphoto/process 走公网直连（端上 wx.request，拿不到云托管注入的平台身份），
  # 置空 = 不校验（仅本地联调）；上线前务必配一个随机串，端上需带请求头 X-Photo-Token。
  api-token: ${PHOTO_API_TOKEN:}
  # ------------------------------------------------------------
  # 云端精修（腾讯云 BDA 人像分割）：
  #   端上 MODNet 对发丝/复杂背景的抠图质量有限，提供可选的云端分割通道。
  #   未配置密钥时 enabled=false，/api/photo/segment 明确返回「未开通」，
  #   前端自动回退端上抠图，不影响其他功能。
  #   BDAB_ENABLED          总开关
  #   BDAB_SECRET_ID/_KEY   腾讯云 API 密钥（访问管理 → 访问密钥；建议用子账号最小权限，仅授权 bda）
  #   BDAB_REGION           仅支持 ap-beijing / ap-guangzhou / ap-shanghai
  #   BDAB_ENDPOINT         可选；默认公网 bda.tencentcloudapi.com。
  #                         云托管容器若直连 https 报 PKIX 证书错误，可试内网域名
  #                         bda.internal.tencentcloudapi.com（限同地域 VPC 内）
  # 计费：每接口每月 1000 次免费额度，超出后付费约 0.01 元/次（详见腾讯云购买指南）
  # ------------------------------------------------------------
  bda:
    enabled: ${BDAB_ENABLED:false}
    secret-id: ${BDAB_SECRET_ID:}
    secret-key: ${BDAB_SECRET_KEY:}
    region: ${BDAB_REGION:ap-guangzhou}
    endpoint: ${BDAB_ENDPOINT:}
    # 美肤开关（肤色提亮+磨皮，作用区域=自定义分割的 Face mask）。
    # 每次美肤+抠图消耗 2 次 BDA 调用（共享每月 1000 次免费额度），独立控制成本。
    # 算法为 v9 定稿版（IdPhotoBeautyService，两条链路共用同一份实现）：
    # YCbCr 只提亮 Y 通道、自适应中位数锚点、单像素封顶 12/255、
    # 连续羽化权重（消除磨皮边界硬线）、绝不变脸型。
    beauty-enabled: ${BDAB_BEAUTY_ENABLED:false}
    # 美肤档位：id（办证档，最保守）/ normal（均衡档，默认）/ portrait（形象档，可见变化）
    beauty-level: ${BDAB_BEAUTY_LEVEL:normal}
  # ------------------------------------------------------------
  # 两个制作接口共享 MySQL 限流，按连续 60 秒 / 24 小时统计。
  # 所有用户（包括会员）都适用；会员不限已有照片的保存次数。
  segment:
    cache:
      ttl-seconds: ${SEGMENT_CACHE_TTL_SECONDS:600}
      max-bytes: ${SEGMENT_CACHE_MAX_BYTES:33554432}
    rate:
      enabled: ${SEGMENT_RATE_ENABLED:true}
      global-minute: ${SEGMENT_RATE_GLOBAL_MINUTE:30}
      global-day: ${SEGMENT_RATE_GLOBAL_DAY:900}
      per-user-minute: ${SEGMENT_RATE_USER_MINUTE:10}
      per-user-day: ${SEGMENT_RATE_USER_DAY:30}

# SDK 日志收敛：DEBUG 级可能把请求体（含图片 base64）打进日志，人脸数据严禁落日志
logging:
  level:
    com.tencentcloudapi: WARN
